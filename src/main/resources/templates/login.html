<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <script th:src="@{/js/theme.js}" defer></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HireTrack</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <span class="brand-icon">H</span>
            HireTrack
        </span>
    </div>
</nav>

<main class="container d-flex justify-content-center py-5">

    <div class="card border-0 shadow-lg rounded-4 p-4"
         style="max-width: 460px; width: 100%;">

        <div class="card-body">
            <p class="eyebrow">WELCOME BACK</p>
            <h1 class="fw-bold mb-2">Login</h1>
            <p class="text-secondary mb-4">
                Sign in to manage your applications.
            </p>

            <div th:if="${param.error}"
                 class="alert alert-danger">
                Invalid email or password.
            </div>

            <div th:if="${param.logout}"
                 class="alert alert-success">
                You have been logged out.
            </div>

            <div th:if="${param.registered}"
                 class="alert alert-success">
                Registration successful. Please log in.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        name="username"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <button class="btn btn-primary w-100 py-2"
                        type="submit">
                    Login
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                Don’t have an account?
                <a th:href="@{/register}">Create account</a>
            </p>
        </div>
    </div>
</main>

</body>
</html>
