<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <script th:src="@{/js/theme.js}" defer></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application | HireTrack</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <span class="brand-icon">H</span>
            HireTrack
        </a>

        <span class="navbar-text text-white">
            Placement Application Tracker
        </span>
    </div>
</nav>

<main class="container form-page py-5">

    <a th:href="@{/}" class="back-link">
        ← Back to dashboard
    </a>

    <section class="form-card">

        <div class="form-card-header">
            <p class="eyebrow">APPLICATION DETAILS</p>
            <h1 th:text="${pageTitle}">Add Application</h1>
            <p>Enter the information about your job application.</p>
        </div>

        <form
            th:action="@{/applications/save}"
            th:object="${application}"
            method="post">

            <!-- ID is generated automatically -->
            <input type="hidden" th:field="*{id}">

            <div class="row g-4">

                <div class="col-md-6">
                    <label class="form-label">Company Name</label>
                    <input
                        type="text"
                        class="form-control"
                        th:field="*{companyName}"
                        th:errorclass="is-invalid"
                        placeholder="Example: Microsoft">

                    <div class="invalid-feedback"
                         th:errors="*{companyName}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Job Role</label>
                    <input
                        type="text"
                        class="form-control"
                        th:field="*{jobRole}"
                        th:errorclass="is-invalid"
                        placeholder="Example: Software Engineer">

                    <div class="invalid-feedback"
                         th:errors="*{jobRole}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Location</label>
                    <input
                        type="text"
                        class="form-control"
                        th:field="*{location}"
                        th:errorclass="is-invalid"
                        placeholder="Example: Bengaluru">

                    <div class="invalid-feedback"
                         th:errors="*{location}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Package (LPA)</label>
                    <input
                        type="number"
                        step="0.1"
                        min="0.1"
                        class="form-control"
                        th:field="*{packageLpa}"
                        th:errorclass="is-invalid"
                        placeholder="Example: 8.5">

                    <div class="invalid-feedback"
                         th:errors="*{packageLpa}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Application Date</label>
                    <input
                        type="date"
                        class="form-control"
                        th:field="*{applicationDate}"
                        th:errorclass="is-invalid">

                    <div class="invalid-feedback"
                         th:errors="*{applicationDate}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select
                        class="form-select"
                        th:field="*{status}"
                        th:errorclass="is-invalid">

                        <option value="Applied">Applied</option>
                        <option value="Online Assessment">
                            Online Assessment
                        </option>
                        <option value="Interview">Interview</option>
                        <option value="Selected">Selected</option>
                        <option value="Rejected">Rejected</option>
                    </select>

                    <div class="invalid-feedback"
                         th:errors="*{status}">
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea
                        class="form-control"
                        rows="4"
                        maxlength="500"
                        th:field="*{notes}"
                        th:errorclass="is-invalid"
                        placeholder="Interview date, contact person, preparation notes, etc.">
                    </textarea>

                    <div class="invalid-feedback"
                         th:errors="*{notes}">
                    </div>
                </div>

            </div>

            <div class="form-actions">
                <a th:href="@{/}" class="btn btn-outline-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary px-4">
                    Save Application
                </button>
            </div>

        </form>
    </section>
</main>

</body>
</html>
