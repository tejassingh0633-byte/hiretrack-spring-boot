<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <script th:src="@{/js/theme.js}" defer></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HireTrack</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <span class="brand-icon">H</span>
            HireTrack
        </span>
    </div>
</nav>

<main class="container d-flex justify-content-center py-5">

    <div class="card border-0 shadow-lg rounded-4 p-4"
         style="max-width: 500px; width: 100%;">

        <div class="card-body">
            <p class="eyebrow">CREATE ACCOUNT</p>
            <h1 class="fw-bold mb-2">Join HireTrack</h1>
            <p class="text-secondary mb-4">
                Start managing your placement applications.
            </p>

            <form
                th:action="@{/register}"
                th:object="${user}"
                method="post">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input
                        type="text"
                        class="form-control"
                        th:field="*{name}"
                        th:errorclass="is-invalid"
                        placeholder="Enter your name">

                    <div class="invalid-feedback"
                         th:errors="*{name}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        th:field="*{email}"
                        th:errorclass="is-invalid"
                        placeholder="Enter your email">

                    <div class="invalid-feedback"
                         th:errors="*{email}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        th:field="*{password}"
                        th:errorclass="is-invalid"
                        placeholder="Minimum 6 characters">

                    <div class="invalid-feedback"
                         th:errors="*{password}">
                    </div>
                </div>

                <button class="btn btn-primary w-100 py-2"
                        type="submit">
                    Create Account
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                Already registered?
                <a th:href="@{/login}">Login here</a>
            </p>
        </div>
    </div>
</main>

</body>
</html>
